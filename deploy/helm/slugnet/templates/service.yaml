apiVersion: v1
kind: Service
metadata:
  name: {{ include "slugnet.fullname" . }}
  labels:
    {{- include "slugnet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # The Service sends traffic to every *ready* pod carrying these labels. Nothing else links them.
  selector:
    {{- include "slugnet.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http # the named containerPort in the Deployment
