name: Deploy

on:
  push:
    branches: [main]
    paths: [Dockerfile, src/slugid/serve.py, src/slugid/api.py, src/slugid/index.html, infra/app.yaml, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write  # GitHub OIDC token, exchanged for short-lived AWS credentials
  contents: read

concurrency: deploy

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  MODEL_VERSION: v2  # s3://<model bucket>/models/<version>/; bump to ship a new model

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read bootstrap stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name slugid-bootstrap \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "MODEL_BUCKET=$(out ModelBucket)" >> "$GITHUB_ENV"
          echo "REPO_URI=$(out RepositoryUri)" >> "$GITHUB_ENV"

      - name: Fetch model artifact
        run: aws s3 cp "s3://$MODEL_BUCKET/models/$MODEL_VERSION/" model/ --recursive

      - name: Build image
        # Lambda rejects multi-platform manifests, so no provenance attestation.
        run: docker build --provenance=false -t slugid:ci .

      - name: Smoke test
        # The image is a plain web app outside Lambda, so test it over HTTP.
        run: |
          docker run -d --rm -p 8080:8080 --name fn slugid:ci
          for _ in $(seq 60); do curl -sf localhost:8080/health && break || sleep 2; done
          check() {
            curl -sf --max-time 60 -F "file=@$1" localhost:8080/v1/predict | python3 -c "
          import json, sys
          top = json.load(sys.stdin)['species'][0]
          print('$1', top)
          assert top['name'] == '$2', top"
          }
          check assets/arion_fuscus.jpg "Arion fuscus"
          check assets/hexabranchus_lacer.jpg "Hexabranchus lacer"
          docker logs fn | tail -5

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        run: |
          docker tag slugid:ci "$REPO_URI:$GITHUB_SHA"
          docker push "$REPO_URI:$GITHUB_SHA"

      - name: Deploy
        run: |
          aws cloudformation deploy --stack-name slugid-app --template-file infra/app.yaml \
            --parameter-overrides ImageUri="$REPO_URI:$GITHUB_SHA" ModelVersion="$MODEL_VERSION" \
            --no-fail-on-empty-changeset

      - name: Check live endpoint
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name slugid-app \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "Function URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          aws lambda wait function-updated --function-name slugid
          # Warm-up: the first request after a deploy is a slow cold start.
          curl -sf --retry 2 --retry-all-errors --max-time 150 "${URL}health"
          # Save then grep: piping into grep -q makes curl hit a broken pipe, which pipefail fails.
          curl -sf --max-time 30 -o page.html "$URL" && grep -q "Slug Identifier" page.html
          curl -sf --max-time 90 -F file=@assets/hexabranchus_lacer.jpg "${URL}v1/predict" \
            | tee -a "$GITHUB_STEP_SUMMARY"
