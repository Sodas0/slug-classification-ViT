[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slugid"
version = "0.1.0"
description = "Slug species classification from photos."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "imagehash>=4.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]
train = ["onnx>=1.16", "open_clip_torch>=2.24", "torch>=2.2", "torchvision>=0.17"]
serve = ["onnxruntime>=1.20"]
api = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slugid = ["index.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
