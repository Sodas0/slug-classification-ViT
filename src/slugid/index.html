<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slug Identifier</title>
<style>
  :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #e2e1da; --accent: #b4561f; --bar: #e9d6c8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --fg: #ecebe6; --muted: #9a9993; --line: #2e2d2a; --accent: #e08a52; --bar: #4a3324; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  label.drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px;
    text-align: center; cursor: pointer; color: var(--muted); }
  label.drop.over, label.drop:hover { border-color: var(--accent); color: var(--fg); }
  input[type=file] { display: none; }
  img#preview { display: none; width: 100%; max-height: 360px; object-fit: contain; border-radius: 12px;
    margin-top: 16px; background: var(--line); }
  #status { color: var(--muted); margin: 16px 0 0; min-height: 1.5em; }
  #status.err { color: #c0392b; }
  h2 { font-size: 1.25rem; margin: 20px 0 2px; font-style: italic; }
  .meta { color: var(--muted); margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; margin: 6px 0; }
  .bar { position: relative; padding: 4px 8px; border-radius: 6px; overflow: hidden; font-style: italic; }
  .bar span { position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--bar); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .row.pick { cursor: pointer; border-radius: 6px; }
  .row.pick:hover .bar, .row.sel .bar { outline: 1px solid var(--accent); }
  h3 { font-size: 0.95rem; font-weight: 600; margin: 20px 0 8px; }
  h3 em { font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grid a { display: block; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--line); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { color: var(--muted); font-size: 0.8rem; margin: 6px 0 0; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Slug Identifier</h1>
  <p class="sub">Upload a photo of a slug or sea slug. 223 classes, trained on iNaturalist.</p>
  <label class="drop" id="drop">Choose a photo or drop it here
    <input type="file" id="file" accept="image/*">
  </label>
  <img id="preview" alt="">
  <p id="status"></p>
  <section id="result"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const status = (msg, err = false) => { $("status").textContent = msg; $("status").className = err ? "err" : ""; };

// Lambda caps request bodies at 6 MB, so downscale in the browser before uploading.
function shrink(file, max = 1024) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("could not encode image"))), "image/jpeg", 0.9);
    };
    img.onerror = () => reject(new Error("could not read that file as an image"));
    img.src = URL.createObjectURL(file);
  });
}

const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function gallery(r, name) {
  const ex = (r.examples || {})[name];
  if (!ex) return name === "other"
    ? `<h3>Probably not a slug</h3><p class="credit">The model thinks this is a snail, leech, flatworm or other look-alike.</p>`
    : "";
  const imgs = ex.map((e) =>
    `<a href="https://www.inaturalist.org/observations/${e.obs}" target="_blank" rel="noopener">` +
    `<img src="${e.url}" alt="${esc(name)}" loading="lazy"></a>`).join("");
  return `<h3>Training photos of <em>${esc(name)}</em></h3><div class="grid">${imgs}</div>` +
    `<p class="credit">Photos from iNaturalist observers. Tap one for the observation and credit.</p>`;
}

function render(r) {
  const top = r.species[0];
  const rows = r.species.map((s, i) =>
    `<div class="row${(r.examples || {})[s.name] ? " pick" : ""}${i === 0 ? " sel" : ""}" data-i="${i}">` +
    `<div class="bar"><i style="width:${(s.prob * 100).toFixed(1)}%"></i><span>${esc(s.name)}</span></div>` +
    `<div class="pct">${(s.prob * 100).toFixed(1)}%</div></div>`).join("");
  $("result").innerHTML =
    `<h2>${esc(top.name)}</h2><p class="meta">Genus ${esc(r.genus[0].name)} · Family ${esc(r.family[0].name)} · ${r.latency_ms} ms</p>` +
    `${rows}<div id="gallery">${gallery(r, top.name)}</div>`;
  $("result").querySelectorAll(".row.pick").forEach((el) => el.addEventListener("click", () => {
    $("result").querySelectorAll(".row").forEach((x) => x.classList.remove("sel"));
    el.classList.add("sel");
    $("gallery").innerHTML = gallery(r, r.species[+el.dataset.i].name);
  }));
}

async function classify(file) {
  if (!file) return;
  $("preview").src = URL.createObjectURL(file); $("preview").style.display = "block";
  $("result").innerHTML = "";
  status("Classifying… the first request after a while can take ~20 s while the model loads.");
  try {
    const body = await shrink(file);
    const res = await fetch(location.pathname, { method: "POST", headers: { "content-type": "image/jpeg" }, body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    status(""); render(data);
  } catch (e) { status(e.message, true); }
}

$("file").addEventListener("change", (e) => classify(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => classify(e.dataTransfer.files[0]));
</script>
</body>
</html>
